#@TYPE: Machine
#@NAME: Nest Learning Thermostat 2nd gen (J49)
#@DESCRIPTION: TI OMAP3630 (DM3730/AM3703, CONTROL_IDCODE 0x2B89102F), ARM Cortex-A8,
#  64 MB RAM, 256 MB NAND. Reverse-engineered from stock firmware
#  Nest-Learning-Thermostat-5.9.4-5-j49-0NXR; see docs/ and tools/kernel-firstlight/.

# --- CPU / tune: Cortex-A8, ARMv7-A, hard-float, NEON (matches the stock armhf ABI) ---
require conf/machine/include/arm/armv7a/tune-cortexa8.inc
DEFAULTTUNE = "cortexa8hf-neon"

# --- Kernel: mainline 6.6 LTS + board patches (meta-j49/recipes-kernel/linux) ---
PREFERRED_PROVIDER_virtual/kernel ?= "linux-j49"
KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE = "ti/omap/omap3-nest-j49.dtb"
# The DTB is appended to the zImage for kexec from the ATAG-era stock kernel
# (tools/kernel-firstlight/build.sh step 5); a modern U-Boot passes it in r2.

# --- Bootloader (TI OMAP3: SPL/MLO + u-boot.img) — NOT built yet (phase C) ---
# Stock is U-Boot 2012.10 "diamond board"; SDRAM base 0x80000000, loadaddr
# 0x81000000. Start modern u-boot from omap3_beagle, then add a diamond/j49 env.
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot"
UBOOT_MACHINE ?= "omap3_beagle_config"
SPL_BINARY = "MLO"
UBOOT_ENTRYPOINT ?= "0x81000000"
UBOOT_LOADADDRESS ?= "0x81000000"

# --- Console ---
# No debug UART is wired on the J49 PCB. The hands-free console is the USB
# gadget serial port (g_serial, /dev/ttyGS0 -> host /dev/ttyACMx); the panel
# (fbcon on tty0) is the other visible console. ttyO0 exists in the stock env
# but has no accessible pads.
SERIAL_CONSOLES ?= "115200;ttyGS0"
SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"
# Proven cmdline on the hardware: full 64 MB (stock caps itself at mem=62M and
# kexec inherits that), small CMA for omapdrm, panel as console.
NEST_KERNEL_CMDLINE = "mem=64M cma=4M console=tty0 panic=15"

# --- Machine features ---
MACHINE_FEATURES = "usbgadget wifi screen rtc"
# Everything this board needs is built into the kernel (j49.cfg); omap2plus_defconfig's
# 20 MB of =m modules do not fit the 46 MiB NAND root slot, so no kernel-modules here.
# The kernel lives in the NAND boot slot, not in the rootfs: drop kernel-base's pull on
# kernel-image (6 MB in /boot otherwise).
RDEPENDS:${KERNEL_PACKAGE_NAME}-base = ""

# WiFi: TI WL1271 on MMC2. Needs the wl127x firmware, a device-specific NVS
# (/lib/firmware/ti-connectivity/wl127x-nvs.bin, extracted from the device's
# mtd10 — NOT in git) and the regulatory database.
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-wl12xx wireless-regdb-static"

# --- Root filesystem / images ---
# Stock boots root=/dev/mtdblock7 rootfstype=jffs2 from NAND (A/B slots).
# No SD slot is populated, so there is no wic/SD image; iterate via kexec +
# initramfs/NFS first, then install into the NAND B slot (boot1/root1).
IMAGE_FSTYPES ?= "tar.xz jffs2 squashfs-xz"
# NAND erase block 0x20000 (128 KiB), page 2 KiB — see docs/flash-layout.md
EXTRA_IMAGECMD:jffs2 = "--little-endian --eraseblock=0x20000 -n"

# The machine keeps the board's name (Nest J49); the running system calls itself "j49".
hostname:pn-base-files = "j49"
