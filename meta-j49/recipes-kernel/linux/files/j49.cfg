# Fragment on top of omap2plus_defconfig for Nest J49 kexec first-light.
# Goal: boot far enough to bring up a USB-gadget serial console over the
# existing USB cable (hands-free visibility), with ramoops as early-boot backup.

# --- USB device controller (MUSB on OMAP3) + TWL4030 USB PHY ---
CONFIG_USB=y
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_OMAP2PLUS=y
CONFIG_USB_MUSB_DUAL_ROLE=y
CONFIG_TWL4030_USB=y
CONFIG_NOP_USB_XCEIV=y
CONFIG_USB_PHY=y

# --- USB gadget: serial function + console ---
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_U_SERIAL=y
CONFIG_U_SERIAL_CONSOLE=y
CONFIG_USB_G_SERIAL=y

# --- USB host + audio input (USB mic / sound card after switching MUSB to host) ---
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=y

# --- pstore/ramoops: survive a hang, read log after (matches DT ramoops node) ---
CONFIG_PSTORE=y
CONFIG_PSTORE_CONSOLE=y
CONFIG_PSTORE_PMSG=y
CONFIG_PSTORE_RAM=y

# --- initramfs (passed externally via kexec --initrd) ---
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# --- keep it bootable/visible ---
CONFIG_PRINTK=y
CONFIG_PRINTK_TIME=y
CONFIG_MAGIC_SYSRQ=y
CONFIG_PANIC_TIMEOUT=0

# --- drop module signing / trusted keys (needs openssl host headers; we build built-in) ---
# CONFIG_MODULE_SIG is not set
CONFIG_SYSTEM_TRUSTED_KEYS=""
CONFIG_SYSTEM_REVOCATION_KEYS=""
# CONFIG_SYSTEM_TRUSTED_KEYRING is not set
# CONFIG_INTEGRITY is not set

# --- hands-free early log: DEBUG_LL into a DRAM ring at 0x83e80000 (no UART on
# this board; patch tools/kernel-firstlight/patches/0001-arm-debug-ll-dram-ring.patch).
# Gives the decompressor banner, head.S error paths and earlyprintk, readable
# from stock via /dev/mem after the watchdog warm reset. Pass "earlyprintk
# keep_bootcon" on the cmdline. OMAP_WATCHDOG=y (2026-10-28): kexec's device_shutdown
# already disables the stock-armed WDT, so the modern kernel must arm its own:
# init opens /dev/watchdog (60 s, nowayout) and pings it from the tick loop.
CONFIG_OMAP_WATCHDOG=y
CONFIG_DEBUG_LL=y
CONFIG_DEBUG_RAM_RING=y
CONFIG_DEBUG_UNCOMPRESS=y
CONFIG_EARLY_PRINTK=y
CONFIG_WATCHDOG_NOWAYOUT=y
# TWL4030 battery charger (BCI), MADC (battery voltage/temperature ADC) and RTC as
# built-ins: off-base USB sessions need battery visibility (/sys/class/power_supply).
CONFIG_IIO=y
CONFIG_TWL4030_MADC=y
# twl4030_bci (charger) freezes the SoC at ~5 s on this board (jumps 30/31/32 bisect, 2026-10-28);
# the hardware BCI charges over USB by itself. merge_config needs the bare form below.
# CONFIG_CHARGER_TWL4030 is not set
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_TWL4030=y
# WiFi: TI WL1271 on MMC2 (SDIO), power via gpio103 (stock label "vmmc2"), irq gpio102.
# Built in so the initramfs needs no modules; firmware wl127x-fw-5-*.bin + the device
# NVS go into /lib/firmware/ti-connectivity (pack-initramfs.sh).
CONFIG_WIRELESS=y
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_TI=y
CONFIG_WLCORE=y
CONFIG_WLCORE_SDIO=y
CONFIG_WL12XX=y
CONFIG_FW_LOADER=y

# Display (jump 40+): OMAP3 DSS via omapdrm, DPI output to the S6D05A1/Tianma TM025ZDZ01
# 320x320 panel (new driver panel-samsung-s6d05a1.c, patches/0004), fbdev emulation so
# fbcon can put the console on the panel (console=tty0). VENC/SDI/DSI/HDMI not wired.
CONFIG_DRM=y
CONFIG_DRM_OMAP=y
CONFIG_OMAP2_DSS_DPI=y
# CONFIG_OMAP2_DSS_VENC is not set
# CONFIG_OMAP2_DSS_SDI is not set
# CONFIG_OMAP2_DSS_DSI is not set
# CONFIG_OMAP2_DSS_HDMI_COMMON is not set
CONFIG_DRM_PANEL=y
CONFIG_DRM_PANEL_SAMSUNG_S6D05A1=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_ROTATION=y
CONFIG_LOGO=y
CONFIG_LOGO_LINUX_CLUT224=y
CONFIG_SPI=y
CONFIG_SPI_OMAP24XX=y
# Backlight: LM3530 on I2C3 0x36 in I2C brightness mode (patches/0006, DT ti,lm3530);
# the DRM panel picks it up via its backlight phandle, so blanking the panel dims it too.
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_LM3530_BL=y
# CONFIG_LEDS_LM3530 is not set
# Yocto: openssl-native has no ENGINE API, so certs/extract-cert cannot link. Nothing here
# needs the system trusted keyring; CFG80211_REQUIRE_SIGNED_REGDB (default y) was the only
# thing selecting SYSTEM_DATA_VERIFICATION -> SYSTEM_TRUSTED_KEYRING -> extract-cert.
# The symbol is only user-visible under CFG80211_CERTIFICATION_ONUS (else it is forced to its
# default y), so enable that first; it merely unlocks regulatory knobs, nothing is changed by it.
CONFIG_CFG80211_CERTIFICATION_ONUS=y
# CONFIG_CFG80211_REQUIRE_SIGNED_REGDB is not set

# cpufreq: omap2plus_defconfig builds cpufreq-dt as a module, so with a built-in-only kernel the
# MPU stays at whatever stock left dpll1 at (300 MHz = OPP50 observed in jump 59, BogoMIPS 299,
# VDD1 already 1.2 V). Build it in so ti-cpufreq + cpufreq-dt scale 300/600/800 MHz (cpu0-supply =
# twl VDD1, OPP table from omap36xx.dtsi). Stats for verification.
# Jumps 60-69 (2026-10-31/11-01): with cpufreq-dt BUILT IN every plain boot hung early (black
# panel, no WDT reset) -- 60, 61, 67, 68, 69 -- while the same binaries booted when the
# cpufreq-dt initcall was blacklisted (62, 63) and, as a module left unloaded, twice out of
# three (65, 66 booted, 64 hung). Loaded by hand later (66) 300<->600 MHz transitions work
# and VDD1 follows. Root cause of the early hang is NOT identified (OPP130 disabled and OPP50
# at 1.2 V did not help). Keep it a module: the Yocto rootfs installs no modules, so the
# image boots; the first-light initramfs carries cpufreq-dt.ko for experiments.
CONFIG_CPUFREQ_DT=m
CONFIG_CPUFREQ_DT_PLATDEV=y
CONFIG_CPU_FREQ_STAT=y

# Ring click = TPS65921 PWRON (jump 59: STS_HW_CONDITIONS bit 0 follows the press). The
# twl4030-pwrbutton driver reports it as KEY_POWER; twl4030.dtsi already carries the node.
# evdev so userspace (and the UI later) can read it from /dev/input.
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_TWL4030_PWRBUTTON=y

# Ring ROTATION = Avago ADBS-A330 optical sensor on I2C2 @0x57 (driver patch 0008,
# compatible "avago,adbs-a330"); reports REL_X/REL_Y on /dev/input/event*. Under the
# INPUT_MISC menu, so enable that too.
CONFIG_INPUT_MISC=y
CONFIG_INPUT_ADBS_A330=y

# Piezo click = head-unit GPT8 PWM -> pwm-beeper (EV_SND/SND_TONE, 2000 Hz / 3 ms stock
# click). PWM_OMAP_DMTIMER is a module in omap2plus_defconfig; build it + the beeper in.
CONFIG_PWM=y
CONFIG_PWM_OMAP_DMTIMER=y
CONFIG_INPUT_PWM_BEEPER=y

# Hardware RNG (DM3730 has an RNG, omap3.dtsi node rng@0 "ti,omap2-rng" already present but the
# driver was unbound -> /sys/class/misc/hw_random/rng_current=none). Without it crng init waits on
# slow entropy, which stalls WPA association (slow WLAN) and the whole boot -> widening the window in
# which the backplate STM32 power-cycles the head unit before bpd heartbeats. Build omap-rng in so it
# seeds crng early in boot.
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_OMAP=y

# 64 KB dmesg wrapped within 9 s of boot under initcall_debug; 256 KB is nothing on 64 MB.
CONFIG_LOG_BUF_SHIFT=18

# RAM-resident rootfs test path (phase 3, before NAND): the kexec initramfs carries the
# j49-image squashfs-xz, loop-mounts it and lays a tmpfs overlay over it so systemd gets a
# writable /etc and /var. loop is already built in (omap2plus_defconfig).
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_OVERLAY_FS=y

# ---- Size trim (first-light jumps 72-77, 2026-11-01) --------------------------------------
# omap2plus_defconfig built in = 13.3 MB text + 5 MB data/rodata/init = 20 MB of the 64 MB
# before a single page is managed (jump 74: "Memory: 18500K/63488K available"). With the
# image squashfs resident the first systemd boot thrashed to a watchdog reset (jump 77).
# The J49 is one OMAP3630 core, WiFi only, no PCI/SATA/Ethernet/USB host/NFS/ext4.
# NOTE (first-light jump 80 vs 78/79): removing the other TI SoCs + SMP + HIGHMEM saved only
# ~1 MB but the WL1271 failed to associate twice with them off and associated with them on,
# so they are LEFT ENABLED (defconfig =y). The memory win below is what mattered.
# Buses / storage that do not exist here
# CONFIG_PCI is not set
# CONFIG_SCSI is not set
# CONFIG_ATA is not set
# CONFIG_BLK_DEV_RAM is not set
# CONFIG_EXT2_FS is not set
# CONFIG_EXT3_FS is not set
# CONFIG_EXT4_FS is not set
# CONFIG_VFAT_FS is not set
# CONFIG_MSDOS_FS is not set
# CONFIG_CRAMFS is not set
# CONFIG_NFS_FS is not set
# CONFIG_ROOT_NFS is not set
# CONFIG_SUNRPC is not set
# Wired networking, netfilter, IPsec, devlink/ethtool netlink: WiFi-only device
# CONFIG_SMSC911X is not set
# CONFIG_KS8851 is not set
# CONFIG_TI_CPSW is not set
# CONFIG_TI_DAVINCI_EMAC is not set
# CONFIG_NETFILTER is not set
# CONFIG_NET_SCHED is not set
# CONFIG_XFRM_USER is not set
# CONFIG_INET_DIAG is not set
# CONFIG_NET_DEVLINK is not set
# CONFIG_ETHTOOL_NETLINK is not set
# Debug/profiling infrastructure
# CONFIG_KPROBES is not set
# CONFIG_PERF_EVENTS is not set
# CONFIG_PROFILING is not set
# CONFIG_FTRACE is not set
# CONFIG_IO_URING is not set
# CONFIG_IKCONFIG is not set
# CONFIG_DEBUG_INFO is not set
CONFIG_DEBUG_INFO_NONE=y
# Other boards' PMICs, IOMMU/remoteproc (no DSP use), touchscreens, boot logo
# CONFIG_MFD_TPS65217 is not set
# CONFIG_MFD_TPS65218 is not set
# CONFIG_MFD_TPS65910 is not set
# CONFIG_MFD_PALMAS is not set
# CONFIG_TWL6040_CORE is not set
# CONFIG_OMAP_IOMMU is not set
# CONFIG_IOMMU_SUPPORT is not set
# CONFIG_REMOTEPROC is not set
# CONFIG_INPUT_TOUCHSCREEN is not set
# CONFIG_LOGO is not set
# CONFIG_FONT_8x8 is not set
CONFIG_SERIAL_8250_NR_UARTS=4
CONFIG_CMA_SIZE_MBYTES=4
# zram swap as a reserve for the RAM-resident image test (lzo is already built in)
CONFIG_ZRAM=y
CONFIG_ZSMALLOC=y

# NAND B-slot boot (first-light jump 83): stock u-boot's nandboot1 passes
# root=/dev/mtdblock9, but under this kernel's partition numbering root1 is
# mtdblock8 (boot1=mtd7, root1=mtd8). EXTEND appends our root= AFTER the
# bootloader's, so it wins on a NAND boot; on a kexec/initramfs boot a trailing
# root= is ignored (rdinit/initramfs owns /), so this is safe for both paths.
# mem=64M: stock u-boot/ATAG_MEM may report less than the full 64 MB (stock itself runs with
# mem=62M); panic=10: an unattended B boot must never sit on a dead kernel; mtdoops writes the
# panic/oops text into the 3 MB "oops" NAND partition (tail of the stock boot1 area, see the DTS)
# so it can be read back from stock after a fall-back (the DRAM window is overwritten by stock).
# console=ttyS0,115200n8: the physical debug UART is OMAP UART1 (MMIO 0x4806a000); the mainline
# 8250_omap driver names it ttyS0 (stock 2.6.37 called it ttyO0). Adding it as a console gives
# kernel log + a serial getty (systemd-getty-generator) on the UART1 TX/RX test points, matching
# stock u-boot (also UART1). Put it BEFORE console=tty0 so the panel (tty0) stays the primary
# /dev/console; ttyS0 is a secondary console, harmless when nothing is attached. The UART1 pads
# are muxed by the DTS pinmux hog (uart1_tx/uart1_rx). To see STOCK U-BOOT on the same wire, clear
# "silent" in the u-boot env (stdout=serial already); that also removes the 256-byte bootargs limit.
CONFIG_CMDLINE="root=/dev/mtdblock8 rootfstype=jffs2 rootwait mem=64M panic=10 mtdoops.mtddev=oops console=ttyS0,115200n8 console=tty0"
CONFIG_CMDLINE_EXTEND=y
CONFIG_MTD_OOPS=y
# Stock u-boot boots the appended-DTB zImage with ATAGs (ARM_ATAG_DTB_COMPAT). The default
# CMDLINE_FROM_BOOTLOADER makes the ATAG cmdline REPLACE the DTS /chosen bootargs
# (console=tty0); EXTEND keeps them and appends the ATAG cmdline. Needed because u-boot's
# silent-console fixup blanks every console= in its own bootargs (2026-11-07).
CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_EXTEND=y
# Dead-man switch for headless bring-up: with HANDLE_BOOT_ENABLED=y the watchdog core pets a
# watchdog that was armed by `omap_wdt.early_enable=1` until userspace opens it, so a kernel
# that never reaches init (or a stalled systemd that does not open /dev/watchdog) is NEVER
# reset (2026-11-08: a B boot sat 29 min until the backplate cold reset wiped DRAM). With =n
# the HW watchdog really fires after timer_margin unless systemd (RuntimeWatchdogSec) pets it.
# DETECT_HUNG_TASK + `hung_task_panic=1` turn a D-state stall into a panic -> warm reset -> ramoops.
# CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED is not set
CONFIG_DETECT_HUNG_TASK=y
CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=120

# ---- Thread / EM357 radio SPI bring-up (2026-11-20) --------------------------------------
# EM357 "ConnectIP" Thread NCP = spinel over SPI on McSPI2 CS0 (= stock /dev/spidev2.0).
# Userspace spi-server + wpantund drive it; wpantund presents it as the wpan0 tun interface.
# SPI_OMAP24XX, GPIO_SYSFS, GPIO_CDEV and IPV6 are already enabled above / by omap2plus_defconfig.
# spidev gives /dev/spidev2.0 (DT node compatible "silabs,em3581", on the spidev whitelist).
CONFIG_SPI_SPIDEV=y
# TUN: wpantund creates the wpan0 point-to-point tunnel for the Thread/IPv6 interface.
CONFIG_TUN=y
# Per-device runtime-PM and wakeup statistics in sysfs: needed to find what keeps the PER and
# CORE power domains on in idle and suspend.
CONFIG_PM_ADVANCED_DEBUG=y
CONFIG_KEXEC=y

# /sys/class/watchdog/watchdog0/bootstatus: 32 = the last reset was the watchdog (j49-release shows it)
CONFIG_WATCHDOG_SYSFS=y
