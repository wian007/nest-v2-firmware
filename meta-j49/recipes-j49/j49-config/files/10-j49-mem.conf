# 64 MB of RAM, 8 MB of it CMA. Watermark boosting (fragmentation heuristic) raised the
# zone's min watermark to 9 MB during the first image boot from RAM and the OOM killer
# took everything out with 16 MB free (first-light jump 76). Off, as on other small boards.
vm.watermark_boost_factor = 0
# WiFi-only device: no need for 6 MB TCP autotuning ceilings.
net.ipv4.tcp_rmem = 4096 65536 1048576
net.ipv4.tcp_wmem = 4096 65536 1048576
